name: travel-agent-orchestrator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_agent}
      POSTGRES_USER: ${POSTGRES_USER:-travel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_agent}
    ports:
      - "${COMPOSE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - travel_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_agent} -d ${POSTGRES_DB:-travel_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${COMPOSE_REDIS_PORT:-6380}:6379"
    volumes:
      - travel_agent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  travel_agent_postgres_data:
    name: travel-agent-orchestrator-postgres-data
  travel_agent_redis_data:
    name: travel-agent-orchestrator-redis-data
